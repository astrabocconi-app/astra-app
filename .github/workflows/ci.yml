name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Turbo pipeline
        run: npx turbo run lint typecheck test build

      # Fails if a Prisma migration is present but the checked-in schema has
      # drifted from it. No-op until the schema/migrations land (deferred).
      - name: Prisma migration drift check
        run: |
          if [ -d packages/db/prisma/migrations ]; then
            npx --workspace @astra/db prisma migrate diff \
              --from-migrations packages/db/prisma/migrations \
              --to-schema-datamodel packages/db/prisma/schema.prisma \
              --exit-code \
            && echo "No drift." \
            || (echo "::error::Prisma schema has drifted from migrations." && exit 1)
          else
            echo "No migrations yet — skipping drift check (schema deferred)."
          fi
